name: Counter
options:
  bundleIdPrefix: com.exploremelon
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  Counter:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Counter
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        # Site is HTTPS, so no App Transport Security exceptions are needed.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.exploremelon.trigger
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        # Allow building/running on the Simulator without a signing identity.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
